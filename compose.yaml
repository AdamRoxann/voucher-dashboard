services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claimlivinmarkt-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_HOST: localhost
      DB_SOCKET: /var/run/mysqld/mysqld.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - claimlivinmarkt_storage:/var/www/html/storage
      - /var/run/mysqld:/var/run/mysqld
    networks:
      - claimlivinmarkt

volumes:
  claimlivinmarkt_storage:

networks:
  claimlivinmarkt:
    driver: bridge
